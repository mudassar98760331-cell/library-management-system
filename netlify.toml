[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Proxy API requests to the Render backend (relative /api/... paths stay unchanged)
[[redirects]]
  from = "/api/*"
  to = "https://library-management-system-d4bh.onrender.com/api/:splat"
  status = 200
  force = true

# Proxy uploaded files (QR codes, payment screenshots) to the Render backend
[[redirects]]
  from = "/uploads/*"
  to = "https://library-management-system-d4bh.onrender.com/uploads/:splat"
  status = 200
  force = true

# SPA fallback for React Router
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
